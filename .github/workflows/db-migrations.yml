# Il database di produzione dice la stessa cosa dei file del progetto?
#
# **Cosa controllava prima, e perche' e' cambiato.** Questo lavoro eseguiva
# `supabase migration list`, che confronta i **nomi dei file** con il quaderno
# delle migration applicate. In questo progetto le migration si applicano a
# mano dall'editor SQL: quel quaderno e' fermo a luglio, e il controllo diceva
# "ne mancano 77" da sempre, anche quando lo schema era perfetto. Un allarme
# che suona sempre e' un allarme che si smette di leggere -- e infatti, il
# giorno che ha girato davvero, le differenze vere le abbiamo trovate a mano.
#
# Adesso confronta lo **schema vero**: tabelle, colonne, regole di accesso,
# permessi, vincoli, funzioni, trigger e indici. I due lati si leggono con la
# stessa interrogazione, `public.inventario_schema()`, che nasce da una
# migration e quindi esiste identica su entrambi.
#
# **Legge e basta.** Non c'e' nessun `db push`, `repair` o `reset`, e il
# permesso richiesto e' `contents: read`.

name: Lo schema di produzione combacia con i file

on:
  push:
    branches:
      - main
    paths:
      - "supabase/migrations/**"
  # Una volta a settimana anche senza modifiche: la deriva puo' nascere
  # dall'altro lato -- qualcuno cambia il database a mano -- e in quel caso
  # nessun push la farebbe notare.
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  confronto:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Senza le credenziali il controllo non puo' guardare la produzione. Si
      # dice subito e con parole chiare, invece di fallire piu' avanti con un
      # errore che non spiega niente.
      - name: Verifica che le credenziali ci siano
        env:
          PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          mancanti=""
          [ -z "$PROJECT_ID" ]  && mancanti="$mancanti SUPABASE_PROJECT_ID"
          [ -z "$SERVICE_KEY" ] && mancanti="$mancanti SUPABASE_SERVICE_ROLE_KEY"

          if [ -n "$mancanti" ]; then
            echo "::error::Il controllo non puo' essere eseguito: mancano i segreti$mancanti"
            {
              echo "## Mancano dei segreti"
              echo ""
              echo "Vanno aggiunti in **Settings → Secrets and variables → Actions**:"
              echo ""
              echo "-\`SUPABASE_PROJECT_ID\`: l'identificativo del progetto, quello nell'indirizzo di Supabase"
              echo "- \`SUPABASE_SERVICE_ROLE_KEY\`: in Supabase, **Project Settings → API**, la chiave \`service_role\`"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Ricostruisci lo schema dai file
        env:
          PGPASSWORD: postgres
        run: |
          bash scripts/ricostruisci-schema.sh "postgresql://postgres@127.0.0.1:5432/postgres"

      - name: Leggi l'inventario del database ricostruito
        env:
          PGPASSWORD: postgres
        run: |
          psql "postgresql://postgres@127.0.0.1:5432/postgres" -tAc \
            "select public.inventario_schema()" > /tmp/inventario-dai-file.json
          echo "Inventario letto: $(wc -c < /tmp/inventario-dai-file.json) byte"

      - name: Confronta con la produzione
        env:
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set +e
          node scripts/confronta-schema.mjs --locale /tmp/inventario-dai-file.json | tee /tmp/esito.txt
          esito=${PIPESTATUS[0]}
          set -e

          {
            echo "## Schema di produzione contro file del progetto"
            echo ""
            echo '```'
            cat /tmp/esito.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$esito" -eq 2 ]; then
            echo "::error::Il controllo non e' riuscito a leggere la produzione. Il motivo e' nel riepilogo."
            exit 1
          fi

          if [ "$esito" -ne 0 ]; then
            echo "::error::Il database di produzione e i file del progetto non dicono la stessa cosa. Il dettaglio e' nel riepilogo."
            exit 1
          fi

          echo "Nessuna differenza."
